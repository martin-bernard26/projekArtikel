<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Flashcard Interaktif SD</title>
<style>
    body {
        font-family: 'Comic Sans MS', cursive;
        background: linear-gradient(to right, #74ebd5, #ACB6E5);
        text-align: center;
        margin: 0;
        padding: 0;
    }

    h1 {
        color: #fff;
        margin-top: 20px;
    }

    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 70vh;
    }

    .card {
        width: 300px;
        height: 200px;
        perspective: 1000px;
        cursor: pointer;
    }

    .inner-card {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.6s;
        transform-style: preserve-3d;
    }

    .card.flip .inner-card {
        transform: rotateY(180deg);
    }

    .front, .back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        color: #fff;
        backface-visibility: hidden;
        padding: 10px;
    }

    .front {
        background: #ff7eb3;
    }

    .back {
        background: #42e695;
        transform: rotateY(180deg);
    }

    .buttons {
        margin-top: 20px;
    }

    button {
        padding: 10px 20px;
        font-size: 18px;
        margin: 5px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #fff;
        transition: 0.3s;
    }

    button:hover {
        background: #ddd;
    }
</style>
</head>

<body>

<h1>📚 Flashcard Pintar SD</h1>

<div class="container">
    <div class="card" onclick="flipCard()">
        <div class="inner-card" id="card">
            <div class="front" id="question">2 + 3 = ?</div>
            <div class="back" id="answer">5</div>
        </div>
    </div>
</div>

<div class="buttons">
    <button onclick="prevCard()">⬅️ Sebelumnya</button>
    <button onclick="nextCard()">➡️ Berikutnya</button>
</div>

<script>
const flashcards = [
    { q: "2 + 3 = ?", a: "5" },
    { q: "5 - 2 = ?", a: "3" },
    { q: "3 x 4 = ?", a: "12" },
    { q: "12 ÷ 3 = ?", a: "4" },
    { q: "10 + 5 = ?", a: "15" },
    { q: "7 - 3 = ?", a: "4" },
    { q: "6 x 2 = ?", a: "12" },
    { q: "8 ÷ 2 = ?", a: "4" }
];

let index = 0;
let flipped = false;

function showCard() {
    document.getElementById("question").innerText = flashcards[index].q;
    document.getElementById("answer").innerText = flashcards[index].a;
    document.querySelector(".card").classList.remove("flip");
    flipped = false;
}

function flipCard() {
    document.querySelector(".card").classList.toggle("flip");
    flipped = !flipped;
}

function nextCard() {
    index = (index + 1) % flashcards.length;
    showCard();
}

function prevCard() {
    index = (index - 1 + flashcards.length) % flashcards.length;
    showCard();
}

showCard();
</script>

</body>
</html>
